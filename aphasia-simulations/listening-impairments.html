<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aphasia Corner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon"> 
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    .tip-content {
      display: none;
    }
    .show {
      display: block;
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900">
  <div class="min-h-screen py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Main content section -->
      <div>
        <h1 class="text-4xl font-semibold text-center lg:text-left mb-8 text-blue-900" style="font-family: 'Courier New', monospace;">
          Listening Impairments Overview
        </h1>
        
        <div class="bg-white shadow-lg rounded-lg overflow-hidden">
          <div class="border-b border-gray-200">
            <!-- Tip section example -->
            <button class="w-full px-4 py-5 sm:px-6 text-left focus:outline-none focus:ring-2 focus:ring-blue-500" data-tip="0" onclick="toggleTip(0)" aria-expanded="false" aria-controls="tip-0">
              <div class="flex items-center justify-between">
                <div class="flex items-center">
                  <div class="flex-shrink-0 mr-4 text-blue-500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
                      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                  </div>
                  <h3 class="text-lg leading-6 font-medium text-gray-900">Tip: Speak slowly and clearly</h3>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 text-gray-500">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </div>
            </button>
            <div id="tip-0" class="tip-content px-4 pb-5 sm:px-6 sm:pb-6">
              <p class="text-gray-700">Take your time and enunciate each word to help the person process the information more easily.</p>
            </div>
          </div>
          <!-- Repeat tip sections as needed -->
        </div>

        <div class="mt-8 text-center lg:text-left">
          <a href="listening-impairments-simulation-1.html" class="inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 transition duration-300 ease-in-out transform hover:scale-105">
            Go to Next Exercise
            <svg xmlns="http://www.w3.org/2000/svg" class="ml-2 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </a>
        </div>
      </div>
      
      <!-- Image section -->
      <div class="flex justify-center lg:justify-end">
        <img src="https://cdn.flintrehab.com/uploads/2020/06/doctor-and-speech-therapy-patient.jpg" alt="Listening Impairment" class="w-full h-auto rounded-lg shadow-lg max-w-sm transition duration-300 ease-in-out transform hover:scale-105" />
      </div>
    </div>
  </div>
  
  <footer class="text-center mt-8">
    <p class="text-gray-600 text-sm">&copy; <span id="currentYear"></span> Aphasia Corner. All rights reserved.  <br/>Developed by <code>Aristocratjnr</code></p>
  </footer>

  <script>
    document.getElementById('currentYear').textContent = new Date().getFullYear();
    function toggleTip(index) {
      const content = document.querySelectorAll('.tip-content');
      const tipContent = content[index];
      const button = document.querySelectorAll('button[data-tip]')[index];
      tipContent.classList.toggle('show');
      
      // Accessibility: update aria-expanded attribute
      const expanded = button.getAttribute('aria-expanded') === 'true' || false;
      button.setAttribute('aria-expanded', !expanded);
    }
  </script>
</body>
</html>
